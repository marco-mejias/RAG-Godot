[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-rag"
version = "0.1.0"
description = "Ask questions about Godot 4 and debug engine errors with a RAG assistant built from the official docs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=1.20",
    "anthropic>=0.70",
    "ollama>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
godot-rag = "godot_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
