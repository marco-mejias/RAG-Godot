# Godot RAG assistant settings. Paths are relative to this file.

docs:
  repo: https://github.com/godotengine/godot-docs.git
  branch: stable                      # the docs for the latest stable Godot 4 release
  base_url: https://docs.godotengine.org/en/stable
  # Top-level folders of the docs repo that get indexed.
  include: [getting_started, tutorials, classes, about]

paths:
  raw: data/raw/godot-docs
  index: data/index

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5   # small, fast on CPU, good for English search
  chunk_chars: 1500                         # max characters per chunk
  chunk_overlap: 200                        # characters repeated between consecutive chunks
  top_k: 6                                  # excerpts given to the LLM per question

llm:
  provider: gemini                    # gemini | claude | ollama  (env LLM_PROVIDER or --provider override it)
  models:
    # A list is a fallback chain: when a model is overloaded (503) or out of quota, the next is tried.
    gemini: [gemini-3.5-flash, gemini-3.7-flash, gemini-3.8-flash, gemini-3.1-flash-lite]
    claude: claude-opus-5-5
    ollama: qwen3:8b

verify:
  # Layer 2 (--verify): the LLM that fact-checks answers against the excerpts.
  # A different, stronger model than the generator works best. With Claude Opus 5.5 a check
  # costs a few cents; set models.claude to claude-haiku-5-5 for checks under a tenth of a cent.
  provider: claude

agent:
  max_steps: 6                        # max tool-calling rounds for explain-error
  results_per_search: 4
